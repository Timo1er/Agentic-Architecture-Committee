version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # ARB Multi-Agent Backend & Web UI
  # ----------------------------------------------------------------------------
  arb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arb-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Architecture Review Board
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://arb_user:arb_password@postgres:5432/arb_db
      - VECTOR_DB_TYPE=qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SECRET_KEY=prod-arb-secret-key-replace-with-secure-vault-value-32char!
      - ENCRYPTION_KEY=ARB_PROD_FERNET_KEY_32_BYTES_0000000000=
      - DEFAULT_LLM_PROVIDER=google
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - arb-network

  # ----------------------------------------------------------------------------
  # Relational Database (PostgreSQL with pgvector)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arb_db
      POSTGRES_USER: arb_user
      POSTGRES_PASSWORD: arb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb_user -d arb_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arb-network

  # ----------------------------------------------------------------------------
  # Vector Database (Qdrant for Continuous Learning & Historical Feedback)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: arb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arb-network

networks:
  arb-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
